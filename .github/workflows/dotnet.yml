name: .NET CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore API
        run: dotnet restore ChurchManagement.API/ChurchManagement.API.csproj

      - name: Restore Tests
        run: dotnet restore ChurchManagement.Tests/ChurchManagement.Tests.csproj

      - name: Build API
        run: dotnet build ChurchManagement.API/ChurchManagement.API.csproj --no-restore --configuration Release

      - name: Build Tests
        run: dotnet build ChurchManagement.Tests/ChurchManagement.Tests.csproj --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test ChurchManagement.Tests/ChurchManagement.Tests.csproj --no-build --configuration Release
